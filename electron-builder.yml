# 打包版：一个拷到别的 Mac 上双击就能用的 .app / .dmg。
#
# 两份外部产物靠下面的 files / extraResources 一起带上（构建前先跑
# scripts/prepare-sidecars.mjs 把第一份收拢到 build/sidecars/）：
#   1. thunder-runtime（Rust，agent 内核）      → Resources/bin/
#   2. runtime-host（预览用的真 Vite dev server） → Resources/runtime-host/
# 既不带 node，也不带 pi-ai bridge：模型调用已经回到 thunder 进程内（thunder 的
# RpiAiClient 直接发 HTTP），那条链上没有任何子进程要起。
#
# 第一份是**另一个仓库**构建的产物。它不再从 thunder 的源码 checkout 里取，而是
# 由 scripts/prepare-sidecars.mjs 按 sidecars.lock.json 的 pin 校验
# build/thunder-bin/ 缓存（或直接用 $THUNDER_*_BIN 指定的那份）——
# 所以「构建本仓库」不再意味着「先有 thunder 的 checkout」。

appId: com.electron.prototype-editor # 与 src/main/index.ts 的 setAppUserModelId 一致
productName: Prototype Studio # 决定 .app 名与 userData 目录名

directories:
  output: dist
  buildResources: build

files:
  # 白名单：不写的话默认 **/* 会把 .work/（约 174M）、runtime-host/、src/ 全卷进 asar。
  - out/**
  - package.json
  # 这一条是必需的，不是保险 —— 已核对 app-builder-lib@26.17.0 的
  # out/fileMatcher.js:getNodeModuleFileMatcher：它只挑以 `!` 开头的模式，
  # 再 prependPattern('**/*') 把生产依赖树整棵放回来，所以 files 里的白名单
  # 对 node_modules 完全无效。渲染层依赖已经被 Vite 打进 out/renderer 了，
  # 留着这棵树只是白增约 200M。
  - '!**/node_modules/**'

extraResources:
  - from: build/sidecars/bin
    to: bin
  # 溯源戳：这批侧车来自哪一版 thunder（由 scripts/prepare-sidecars.mjs 生成）。
  # 就绪表里显示它，出问题时才知道内嵌的子包是哪一版。
  - from: build/sidecars/thunder-revision.txt
    to: thunder-revision.txt
  # 预览宿主本体。
  - from: runtime-host
    to: runtime-host
    filter:
      - '**/*'
      - '!dist' # 上一次 vite build 的残留
      - '!.probe' # 早期调试用的临时沙盒（已被 .gitignore 忽略）
  # 它的 node_modules 必须单独来一条，不能靠上面那条带下来：
  # app-builder-lib/out/util/filter.js 的 createFilter() 里有一条无条件规则 ——
  # 「相对 from 恰好等于 node_modules」的路径一律 return false（那是为打包 app
  # 自身依赖设的，extraResources 也照走）。换成把 from 指向它本身，相对路径就
  # 不再等于 "node_modules"，于是整树能带上。
  # pnpm 的软链是相对的（`element-plus -> .pnpm/...`），而 builder-util 的
  # copyDir 会原样重建软链（builder-util/out/fs.js:244-262），所以复制后自洽。
  - from: runtime-host/node_modules
    to: runtime-host/node_modules
    filter:
      - '**/*'
      - '!.vite' # dev 期的依赖预构建缓存，换台机器只会碍事（Vite 会自己重建）

mac:
  target:
    - target: dmg
      arch: [arm64]
  # 应用图标（.app 与 dmg 都用它）。默认也会到 buildResources（build/）里找
  # icon.icns，这里显式写出来是因为这个文件没有第二个来源：它以 build/icon.png
  # 为母版（1024，内容 832×832 居中、四边留 96px 透明，符合 macOS 图标栅格），
  # 用 sips 逐级降采样成 16…512@2x 再由 iconutil 合成；icon.png 同时是 dev dock
  # 图标与非 mac 目标的备用图。换图就换这两份，再 build:mac。
  # 不配的后果实测过：CFBundleIconFile 会是 Electron 自带的 electron.icns。
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # 本机没有可用的签名证书（security find-identity 为 0 个有效身份），显式关掉，
  # 免得构建中途要求证书。未签名 + 自己构建（无 quarantine 属性）可直接双击；
  # 拷给别人要先 xattr -dr com.apple.quarantine。
  identity: null
